name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */12 * * *" # twice a day

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#4f46e5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#06b6d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
