<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Karthik M P, Full-Stack &amp; AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; letter-spacing: 1px; }
    .sub  { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #c7d2fe; letter-spacing: 3px; }
    .chip { font: 600 14px 'Fira Code', Consolas, monospace; fill: #e0e7ff; }
    .rise { opacity: 0; animation: rise .9s ease-out forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 8s ease-in-out infinite reverse; }
    @keyframes float { 50% { transform: translateY(-10px); } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <circle class="float" cx="1080" cy="40" r="120" fill="#22d3ee" opacity="0.12"/>
    <circle class="float2" cx="140" cy="230" r="110" fill="#818cf8" opacity="0.14"/>
    <!-- agent graph motif -->
    <g class="float2" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="1.5" fill="#a5b4fc" fill-opacity="0.7">
      <line x1="960" y1="150" x2="1030" y2="110"/><line x1="1030" y1="110" x2="1110" y2="150"/>
      <line x1="1030" y1="110" x2="1040" y2="190"/><line x1="960" y1="150" x2="1040" y2="190"/>
      <circle cx="960" cy="150" r="5"/><circle cx="1030" cy="110" r="7"/>
      <circle cx="1110" cy="150" r="5"/><circle cx="1040" cy="190" r="5"/>
    </g>
  </g>
  <text x="600" y="112" text-anchor="middle" class="name rise" fill="url(#txt)">Karthik M P</text>
  <text x="600" y="152" text-anchor="middle" class="sub rise d1">FULL-STACK &amp; AI ENGINEER</text>
  <g class="rise d2">
    <rect x="388" y="176" width="424" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="600" y="197" text-anchor="middle" class="chip">React · LangGraph · FastAPI · Spring Boot</text>
  </g>
</svg>
